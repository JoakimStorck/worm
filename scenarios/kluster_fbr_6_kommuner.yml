# === EXEMPELSCENARIO: Dalaklustret sex kommuner ===
scenario_name: "Kluster FBR 6-kommun baseline"
description: >
  Baslinjescenario för Falun, Borlänge, Gagnef, Säter, Rättvik och Hofors.
  Syftet är att visa hur gemensamma och kommunvisa parametrar kan samspela.
start_year: 2024
end_year: 2030
seed: 12345

municipalities:
  - 2080   # Falun
  - 2081   # Borlänge
  - 2026   # Gagnef
  - 2082   # Säter
  - 2031   # Rättvik
  - 2104   # Hofors

# === Globalt default för alla kommuner ===
defaults:
  population: auto          # Tar från databas om möjligt
  workforce_ratio: 0.52
  education_levels:
    low: 0.25
    medium: 0.60
    high: 0.15
  sex_ratio: 0.51           # Andel kvinnor
  occupation_distribution: "realistic"
  employer_distribution:
    n_employers: auto
    employer_ratio_per_population: 0.09
    allocation_order:
      - business_zones
      - commercial_zones
      - small_localities
      - urban_areas
    layer_configs:
      business_zones:
        weight_field: num_workplaces
      commercial_zones:
        weight_field: num_workplaces
      small_localities:
        weight_field: num_workplaces
      urban_areas:
        weight_field: population
    employer_size_distribution:
      micro:
        max_size: 9
        ratio: 0.85
      small:
        min_size: 10
        max_size: 49
        ratio: 0.12
      medium_large:
        min_size: 50
        max_size: 250
        ratio: 0.025
      very_large:
        min_size: 251
        max_size: 1000
        ratio: 0.005

# === Kommunvisa overrides (bara skillnader mot defaults!) ===
municipality_overrides:
  2080: # Falun
    education_levels:
      low: {curve: linear, start: 0.23, end: 0.18, start_year: 2024, end_year: 2030}
      medium: 0.63
      high: {by_year: {2024: 0.14, 2027: 0.18, 2030: 0.19}}
    workforce_ratio: 0.56
  2081: # Borlänge
    workforce_ratio: 0.53
    education_levels:
      low: 0.28
      medium: 0.60
      high: 0.12
  2026: # Gagnef
    workforce_ratio: 0.49
    education_levels:
      low: 0.33
      medium: 0.59
      high: 0.08
  2082: # Säter
    workforce_ratio: 0.50
    education_levels:
      low: 0.30
      medium: 0.58
      high: 0.12
  2031: # Rättvik
    workforce_ratio: 0.48
    education_levels:
      low: 0.34
      medium: 0.58
      high: 0.08
  2104: # Hofors
    workforce_ratio: 0.46
    education_levels:
      low: 0.35
      medium: 0.57
      high: 0.08

# === Policyregler (exempel, kan kompletteras) ===
hiring_policy: "random"
wage_policy: "market_adjust"

# === Händelser (exempel) ===
events:
  - year: 2026
    type: firm_entry
    municipality: 2081
    employer:
      name: "Gigafabriken Borlänge"
      size: 950
      sni_code: "29"
  - year: 2028
    type: firm_exit
    municipality: 2031
    employer_name: "Dala Verkstad AB"

