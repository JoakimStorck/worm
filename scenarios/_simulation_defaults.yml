# _simulation_defaults.yml
# ------------------------------------------------------------------
# Delad grundkonfiguration för simulering och matchning.
#
# Scenarier hämtar in den med
#
#     extends: _simulation_defaults.yml
#
# och kan sedan överskugga enskilda nycklar. Poängen är att en jämförelse
# MELLAN kommuner ska mäta kommunskillnader, inte parameterskillnader: kör
# Mora med sina egna värden och Falun med implicita defaultvärden, och
# skillnaden i utfall blir delvis en artefakt av konfigurationen.
#
# Geometri- och matchningsparametrarna är kalibrerade enligt
# "Two scales of occupational mobility" (median 1.03 task-radier).
# ------------------------------------------------------------------

simulation:
  log_to_console: true
  log_to_file: true
  logfile_path: "output/mora_baseline.log"
  # alpha_chi/alpha_xi: OBSOLETA – ersatta av euklidiskt avstånd i planet
  # --- Yrkeskälla: 'sni' (SNI-fördelning x sni_onet_link) eller 'register'
  #     (tabellen occupation_weights_by_municipality, se scripts/load_occupation_weights.py)
  occupation_source: sni
  # alpha_geo, utility_min: OBSOLETA – ersatta av överskottsmatchning nedan
  # Kärnbredd sigma = sigma_gamma * sqrt(r_o^2 + r_i^2).
  # Empiriskt grundad: med lokalt likformig jobbtäthet är accepterat avstånd
  # Rayleigh-fördelat med median sigma*sqrt(2 ln 2) = 1.1774*sigma. Observerad
  # median är 1.03 task-radier (CPS 2020-2024, Two scales of occupational
  # mobility), vilket ger sigma = 1.03/1.1774 = 0.875 * r_o.
  sigma_gamma: 0.875
  # --- Överskottsmatchning: S = p*w - c*km - w_res, allt i löneandelar (medellön = 1)
  rho_reservation: 0.7      # reservationslön = rho * Π(egen position); faller till rho*lön vid arbetslöshet
  commute_cost_per_km: 0.005  # pendlingskostnad per km i löneandelar (26 km ≈ 13 % av medellönen)
  # Logit-val bland de positioner som är levande alternativ. choice_scale är
  # den lönemarginal, i andelar av medellönen, inom vilken alternativ uppfattas
  # som likvärdiga: ett närmare jobb väljs framför ett längre bort när lönen är
  # ungefär densamma, men valet är inte deterministiskt. Låg skala ger kortare
  # pendling (mätt 7.6 km vid 0.01 mot 12.1 vid 0.30) och kan kalibreras mot
  # faktiska pendlingsavstånd.
  choice_scale: 0.05
  # Geografisk avklingning i MÖTESSANNOLIKHETEN, km. Sannolikheten att en
  # position alls är ett levande alternativ multipliceras med exp(-km/d0).
  #
  # Varför den behövs: relevansfiltret i search_once mäter avstånd i
  # UPPGIFTSRUMMET. Planet kom tidigare in enbart som -commute_cost_per_km*km
  # inuti överskottet S, och S divideras med (1 + kö). Med medel tolv sökande
  # per vakans blir straffet 0.005 per km till 0.0004, och mot choice_scale
  # 0.05 är femtio kilometer värt vikten 0.68 mot ett jobb runt hörnet -- utan
  # kön hade det varit 0.007. Avståndet var bortdividerat, inte felkalibrerat.
  #
  # null stänger av mekanismen och ger exakt tidigare beteende. Skalan ska
  # kalibreras mot tabellen commuting: kör scenariot och se kvoten per
  # riktning i scripts/diagnose_commuting.py. För Ovansiljan låg modellens
  # flöden 1.33 till 4.94 gånger SCB:s, med de svagaste paren mest
  # överskattade -- signaturen för en för flack avklingning.
  # 25 km är mätt, inte valt: svep över 40, 25 och 15 gav RMS av log-kvoterna
  # mot SCB:s flöden 0.786, 0.619 och 0.651, alltså ett minimum vid 25. Utan
  # avklingning var talet 0.979. Bruttonivån förbättras monotont (1.82 -> 1.25)
  # men spridningen mellan paren gör det inte: den är 4.4 gånger vid 25 och 7.2
  # vid 15, eftersom exponentialformen har för tunn svans. Älvdalen mot Mora --
  # verklighetens näst största flöde -- stryps till 0.31 vid d0 = 15 medan Orsa
  # mot Älvdalen fortfarande ligger på 2.26. Formen bör bytas mot en med
  # potenssvans, (1 + km/d0)^-beta, men det är en egen ändring.
  commute_decay_km: 25
  # Koncentration i individernas yrkesfördelning. Individernas yrken dras ur
  # kommunens yrkesprofil UPPHÖJD till detta tal och omnormaliserad: vanliga
  # yrken blir vanligare, sällsynta sällsyntare. Jobben dras ur samma profil
  # utan exponent, så ett värde skilt från 1.0 ger arbetare och jobb olika
  # koncentration i uppgiftsrummet -- en felmatchningskälla oberoende av allt
  # annat i modellen.
  #
  # 1.5 stod hårdkodat i scenariobuilder utan härledning och är kvar som
  # förval för att inte ändra befintliga körningar tyst. 1.0 betyder att
  # individer och jobb dras ur samma fördelning. Sveps mot arbetslöshet per
  # kommun jämförd med SCB:s arbetsmarknadsstatus.
  # Varifrån invånarnas yrken hämtas. "register" läser
  # occupation_weights_by_municipality -- yrkesregistrets nattbefolkning,
  # skattad per kommun med IPF och översatt till O*NET. "sni" är den gamla
  # vägen: kommunens branschmix PÅ ARBETSSTÄLLENA, använd som fördelning över
  # INVÅNARNA, vilket ger utpendlingskommuner yrken ur fel kommuns näringsliv.
  #
  # register faller tillbaka på sni om tabellen saknas eller inte täcker
  # kommunen, med en rad i loggen. Databasen måste alltså inte vara byggd med
  # yrkesregistret för att ett scenario ska gå att köra.
  # Varifrån arbetslösheten per kommun hämtas. "register" läser
  # labour_market_status -- SCB:s registerbaserade arbetsmarknadsstatus.
  # "scenario" använder unemployment_rate ur scenariofilen.
  #
  # Talet är inte kosmetiskt. Sedan 0137 back-räknas arbetskraften ur det,
  # L = syss / (1 - u), och eftersom u = u_min + V/L med u_min = 1 - J/L sätter
  # det golvet för modellens arbetslöshet direkt. För Ovansiljan gav
  # platshållarna 6.5, 7.5 och 7.0 procent ett golv på 6.8 procent; SCB:s
  # faktiska 2.35, 3.51 och 3.17 ger 2.75.
  #
  # SCB:s uttag är 20-65 år medan modellen räknar 15-74, så nivån är inte
  # exakt överförbar -- men den är närmare sanningen än en platshållare, och
  # rangordningen mellan kommunerna är SCB:s. Faller tillbaka på
  # scenariofilen om tabellen saknas eller inte täcker alla kommunerna.
  unemployment_source: register

  # OMSKOLNING. handle_start_education var fullt byggd men händelsen pushades
  # aldrig: flows_table visade noll förekomster genom hela körningen.
  # Omskolning var inte slumpmässig -- den existerade inte.
  #
  # Faran stiger med arbetslöshetens längd. Den som nyss blivit arbetslös
  # söker jobb; den som varit utan arbete länge söker sig till utbildning. Det
  # är också den enda vägen tillbaka för den vars kompetenscirkel suddats ut,
  # eftersom skärpning kräver anställning.
  #
  # Grundtakten är individens propensity_start_education som en ÅRLIG rat --
  # scenariot ger den medelvärde 0.12 -- och dragningen är Poisson-tunning mot
  # förfluten tid, inte en sannolikhet per sökning. En sannolikhet per sökning
  # hade gjort omskolning vanligare för den som söker ofta.
  education_rate_scale: 1.0
  education_half_days: 270
  education_width_days: 90
  education_duration_days: 365

  occupation_source: register

  occupation_concentration: 1.5

  # --- Omgivningen (docs/omgivning.md) ---
  # Inpendlingsreservoaren: storlek som multipel av matrisens inpendlingsstock
  # (ger urval), och sökintervallet som multipel av den arbetslösas (styr hur
  # många som anställs). Kalibrerat i O5 mot matrisens stock det FÖRSTA året,
  # 1 685 mot 1 727 i Ovansiljan: senare växer stocken, eftersom inpendlarna
  # fyller hålet efter pensionsavgångar som inget inträde ersätter.
  # Kalibreras om efter steg 6b.
  inpendling_reservoar_faktor: 3.0
  inpendling_sokfaktor: 25.0
  # Utpendlingen: andelen av invånarnas sökningar som också ger ett
  # erbjudande utifrån. Kalibrerat i O5: 1 745 utpendlare år 7-10 mot 1 767.
  utpendling_erbjudande_andel: 0.2

  # --- Ålder (docs/individmodell.md, avsnitt 11) ---
  # Åldern dras ur SCB:s befolkning per ettårsklass (population_by_age) och
  # ökar med ett år vid varje årsskifte. Den som når riktåldern lämnar
  # arbetskraften och hennes position blir vakant.
  #
  # retirement_age är riktåldern för allmän pension, 67 år från 2026. Att den
  # är en skarp gräns och inte en fara från 63 är ett medvetet förenklande
  # steg: förtida utträde (sjuk- och aktivitetsersättning) är vanligare i
  # glesbygd än i riket och hör till en egen mekanism, inte till den här.
  #
  # work_age_min är den nedre gränsen för arbetsför ålder i
  # dragningen. Deltagandet behandlas som platt mellan gränserna, vilket är
  # fel i känd riktning: de yngsta och de äldsta deltar mindre. AKU:s
  # deltagande per ålder finns inte i databasen.
  #
  # entry_age är inträdesåldern i arbetslivet per utbildningsnivå och sätter
  # taket för hur lång tenure en individ kan ha dragit vid uppstarten.
  age:
    retirement_age: 67
    # Bredden på övergången kring riktåldern, i år. Styr hur utsmetat
    # utträdet är: Pensionsmyndigheten redovisar att 20 procent av årskullen
    # född 1960 tog ut pension vid exakt 65, mot 77 procent för årskullen
    # född 1938. Klippan var fel även historiskt och är det alltmer.
    retirement_spread: 0.8
    # Profilens övre gräns. Över 74 finns inget underlag i BAS.
    max_alder: 74
    work_age_min: 16
    # Nycklarna är SCB:s sjugradiga utbildningsskala: 1-2 förgymnasial,
    # 3-4 gymnasial, 5-6 eftergymnasial, 7 forskarnivå.
    entry_age:
      1: 17
      2: 17
      3: 19
      4: 20
      5: 22
      6: 25
      7: 30

  # --- Kompetenscirklar (docs/individmodell.md, avsnitt 2) ---
  # Individen är en samling cirklar, en per erfarenhet. Exponering bygger
  # massa, läckage gallrar och mättar, diffusion suddar spetsen, skärpning
  # återställer den vid aktivitet. Ersätter initial_r, switch_cost_kappa och
  # breadth_from_move.
  competence:
    exposure_rate: 1.0            # a: massa per år i aktivt yrke (enhet)
    leak_half_life_years: 15      # lambda = ln2/15; mättnad a/lambda ~ 21.6 år
    # D: rho2 växer med 2D per år för den inaktiva cirkeln. 0.015 gav
    # fördubblad rho2 på 2.4 år, alltså spetsen halverad, vilket visade sig
    # för snabbt: arbetslöshet blev ett absorberande tillstånd. 0.004 ger
    # samma fördubbling på ungefär nio år, vilket ligger närmare vad
    # ärrbildningslitteraturen beskriver.
    diffusion: 0.004
    # Tak för diffusionen, som multipel av cirkelns EGEN vilaradie. Utan tak
    # är arbetslöshet absorberande: cirkeln suddas, bredden går in i
    # konkurrenskraften som 2*ro2/(rho2 + ro2), q faller, hon blir inte
    # anställd, och skärpning kräver just den anställning hon inte får. I en
    # tioårskörning satt 596 personer fast så, varav 403 i Älvdalen -- tolv
    # procent av kommunens arbetskraft. Relativt och inte absolut, så att den
    # med bred profil från början inte straffas av samma gräns som den med
    # smal. 0 stänger av taket.
    diffusion_max_ratio: 4.0
    sharpen_months: 6             # tau_s: månader att återfå skärpa
    m_ref_years: 2.0              # massa som ger nästan full konkurrenskraft
    circle_slots: 12              # radens startbredd; växer vid behov, inget tak
    initial_tenure_mean_years: 8  # ålder saknas; tenure dras exponentiellt
    tasks_per_occupation_default: 20   # k för r_o/sqrt(k) om n_tasks saknas
    retraining_radius2: 0.25      # omskolningscirkelns radie^2 (bred)

  # --- Krav och produktivitet ---
  # Produktivitet i ett jobb är q ** (requirement_k * r_req), där r_req är
  # jobbets kravintensitet ur kapabilitetsfältet (Technology fields; läkare
  # 0.84, advokater 0.81, snickare 0.15, diskare 0.00). r_req = 0 gör alla
  # fullt produktiva; r_req = 1 gör produktiviteten q**k. Utan detta
  # behandlades konkurrenskraft som produktivitet för alla jobb: en
  # okvalificerad producerade fem procent av en kirurg och advokaten tio
  # procent av en diskare -- båda fel. Job Zone ersätter r_req i steg 4.
  requirement_k: 2.0

  # --- Förhandlad lön (docs/individmodell.md, avsnitt 5) ---
  # w/Pi = (1 - beta) * max(w_res, phi*Pi)/Pi + beta * p, affär om p*Pi >= max(...).
  # Förankrad i fältet: referensarbetaren (p = 1, reservation = egen lön) får
  # exakt Pi, och i jämvikt konvergerar w mot p*Pi. Produktionsskala och
  # vakanskostnad utgår -- de följde av ankaret. Golvet phi*Pi är arbetarens
  # fallback (avtalslönen), inte ett klipp: utfallet ligger över det och
  # varierar med p. Arbetsgivaren deltar om p >= phi, vilket ger
  # kompetenströskeln q ** (k*r) >= phi, strängare ju mer jobbet kräver.
  # Arbetsgivareffekt i lönen, Pi_j = Pi_o * exp(eta_j). Storleksordningar att
  # kalibrera mot SCB:s lönestrukturstatistik per näringsgren och storleks-
  # klass, inte skattningar. AKM-dekompositioner ger arbetsgivarkomponenten
  # 10-20 procent av variansen i log lön.
  employer_wage_sd: 0.10        # residual per arbetsgivare, sd i log lön
  employer_size_premium: 0.02   # per log-enhet storlek relativt tio anställda

  # Årlig lönerevision. Ökningen ges i PROCENT av befintlig lön, med
  # prestation som spridning kring märket -- inte som en omräkning mot
  # Pi*p**theta. Vägberoendet är vad som skapar lönespridning över en karriär.
  # Märket faller ut ur alla kvoter (både löner och Pi räknas realt), men styr
  # avkortningen: g >= 0 ger inga nominella sänkningar, och eftersom märket
  # ligger över noll blir nollutfall ovanliga utan att vara omöjliga.
  # beta_q = 0 stänger av den individuella delen, så de två effekterna kan
  # prövas var för sig. Värdena är storleksordningar att kalibrera mot
  # observerad spridning i löneutveckling, inte skattningar.
  wage_revision:
    enabled: true
    markup: 0.025           # märket, ungefär industrins norm
    beta_q: 0.10            # hur mycket tillväxt i q RELATIVT KOLLEGORNA betalar sig

  bargaining:
    enabled: true
    beta: 0.5                 # används bara om theta saknas (gamla formeln)
    # theta: graden av individuell lönesättning. 0 = alla får Pi, 1 = var och
    # en sin produktivitet. Sätts theta används w = Pi * p**theta med golvet
    # som undre gräns; utan den körs den gamla Nash-formeln oförändrat.
    theta: 0.5
    labour_share: 0.65        # Pi är lön, produktionsvärdet är Pi/lambda             # arbetarens förhandlingsstyrka
    wage_floor_share: 0.70  # avtalslön som andel av yrkets fältlön

  # --- Omskolning: riktad mot där arbete finns, inte ett fast delta_xi ---
  retraining_share: 0.5          # andel av vägen mot vakansernas tyngdpunkt
  retraining_target_k: 50        # antal bästa vakanser som bestämmer riktningen
  retraining_days_per_unit: 900  # varaktighet per enhet förflyttning i planet
  retraining_min_days: 30        # kortaste omskolning
  # --- Annonsering och urval (docs/individmodell.md) ---
  # Arbetsgivaren annonserar, sökande som passerar deltagandevillkoret ansöker,
  # och vid stängning väljs den med högst KONKURRENSKRAFT q -- inte högst
  # produktivitet p, som är identiskt ett för alla i jobb med r_j ~ 0 och
  # därför inte kan rangordna någon i just den kvartilen. Motivet är
  # upplärningskostnad och risk, inte produktion.
  #
  # FÖNSTRET ÄR TJUGO DAGAR, inte fyrtio (C4b, docs/stockarna.md). Fönstret
  # öppnar vid första ansökan och är en fast minsta vakanstid: med 40 dagar
  # var medianen vid beslut 42 och den öppna tiden enligt Littles lag 64-69
  # dagar, mot SCB:s rekryteringstid -- lediga jobb genom nyanställningar,
  # TAB4307 -- på 32 dagar för näringslivet 2022-2024. Öppna vakanser låg
  # stationärt på 4,6 procent av jobben mot Dalarnas 2,03 (TAB6605). Med 20
  # dagar blir de 3,1 procent; under 20 planar det ut kring 3,0, eftersom
  # golvet då sätts av väntan på en lämplig sökande och inte av fönstret.
  # Tre tider, var och en med sitt skäl:
  #   application_window_days  annonsering, tills arbetsgivaren väljer
  #   hiring_decision_days     referenser, beslut, kontrakt -- gäller alla
  #   notice_period_days       uppsägningstid, NOLL för en arbetslös
  # Bara de två första hör till vakansen som SCB:s KV mäter: en obemannad
  # befattning som rekryteringsförfarandet pågår för, inte tiden till
  # tillträde. I dagens population kommer alla anställda från arbetslöshet,
  # så uppsägningstiden är noll tills steg 2 (sökning från anställning) finns.
  # Sökning från anställning. Anställda söker med on_the_job_search_factor
  # gånger den arbetslösas intervall (28 dagar), efter en ramp i det nya
  # jobbet -- Jovanovics inlärningsargument. Bara uppgången parametriseras:
  # avtagandet faller ut ur att reservationen är nuvarande lön, så den som
  # klättrat har färre jobb som slår den. switching_cost_share är
  # bytesfriktionen som andel av nuvarande lön.
  #
  # FAKTORN sätts mot sökfrekvensen, inte mot bytena (0090). Faktor 5 gav
  # 2.2 sökningar per anställd och år, vilket är amerikansk nivå (Faberman
  # m.fl. 2022: ~20 procent av anställda sökte senaste fyra veckorna). AKU:s
  # ombytessökande ligger lägre, kring en sökepisod per år. Faktor 10 ger
  # 1.1 (svepet 0089: 5/8/9/10 -> 2.20/1.39/1.24/1.11, exakt 365/(28 x f)
  # minus rampen). Svepet visade också att bytena INTE styrs av faktorn:
  # halverad sökning gav 17 procent färre byten. Bytena bärs av det första
  # steget efter arbetslöshet, alltså av ingångslönens rabatt, och den
  # kalibreras för sig (reservationens fall). Rampen är ett modellval, se
  # individmodell.md 6.
  on_the_job_search_factor: 10.0
  # Den underbetalda söker oftare: sökintervallet kortas med
  # 1 + gamma * (Pi - w)/Pi. 0 stänger av. Att hon BYTER oftare följde förut
  # bara av att fler positioner gav positivt överskott, men intensiteten var
  # konstant oavsett om hon låg under yrkets pris.
  underpay_search_gamma: 0.0

  on_the_job_search_ramp_days: 180
  switching_cost_share: 0.05

  application_window_days: 20
  hiring_decision_days: 10
  notice_period_days: 30
  min_surplus: 0.0          # acceptera om S > min_surplus
  # LÖNEANSPRÅKET UNDER ARBETSLÖSHET. "duration" (förval) låter anspråket
  # starta på senaste lön och falla sigmoidalt med arbetslöshetens LÄNGD mot
  # ett golv; "per_search" är det gamla beteendet, 5 procent per misslyckad
  # sökning, kvar för jämförelse.
  #
  # Tiden är rätt variabel. Med per_search halverades anspråket på ett år,
  # men bara för att arbetslösa söker tretton gånger om året -- den som sökte
  # sällan behöll sitt anspråk längre, vilket är bakvänt. Nu är sökintensitet
  # och anspråkets fall oberoende.
  #
  # Mittpunkten har ett svenskt ankare: a-kassan ger 80 procent av tidigare
  # lön de första 100 dagarna, sedan 70, och efter ett år grundnivå. 150 dagar
  # ligger i den trappan. Bredden 60 dagar ger en märkbar men inte abrupt
  # sänkning: från 95 procent av vägen kvar vid 30 dagar till 5 procent vid
  # 270.
  reservation_mode: duration
  reservation_half_days: 150
  reservation_width_days: 60
  # Två golv, det bindande är det högsta. Det relativa fångar att ingen
  # halverar sitt anspråk hur länge hon än söker; det absoluta fångar
  # kollektivavtalens lägstalöner, som ligger på en andel av YRKETS nivå och
  # inte av den egna tidigare lönen. 0.0 stänger av Pi-golvet.
  # ANSPRÅKET ÄR EN PERCENTIL i lönefördelningen över individens egen
  # relevansmängd -- de positioner q släpper igenom, viktade med
  # mötessannolikheten. Hon tar de bästa X procenten av vad hon ser, och X
  # faller sigmoidalt med arbetslöshetens längd. Ingångspercentilen är den
  # hennes senaste lön motsvarar i just hennes mängd.
  #
  # Yrkets medel behöver därmed ingen egen referens: det ÄR percentil femtio
  # så länge hennes yrke dominerar mängden. Övergången till andra yrken kräver
  # ingen mekanism -- när percentilen sjunker kommer sämre passande positioner
  # med, och de betalar mindre av sig själva genom p = q ** (k * r_req).
  #
  # AVTALSGOLVET LIGGER INTE HÄR utan på positionens sida, som
  # wage_floor_share * Pi i negotiated_wage. Det är en egenskap hos jobbet och
  # inte hos henne: avtalet i vården är detsamma oavsett vad hon tjänade förut.
  reservation_min_percentile: 0.05
  # Största relativa sänkning per månad. Percentilskalan är olinjär, så en
  # liten percentilförändring blir en stor löneförändring i svansarna, och en
  # person som sitter högt upp kan annars tappa en femtedel på en månad.
  # Trögheten ÄR mekanismen -- den ger arbetslösheten dess längd -- och får
  # inte kringgås av att skalan är olinjär. 0 stänger av taket.
  reservation_max_drop_per_month: 0.08
  # Fallback när relevansmängden är för tunn för att skatta en fördelning:
  # personrelativ sigmoid mot en andel av senaste lön.
  reservation_floor_fraction: 0.6
  reservation_decay_per_search: 0.95   # används bara i läget per_search
  # Reservationslönens golv. 0.10 av medellönen är orimligt lågt: med a-kassa
  # och försörjningsstöd ligger den reella nivån kring 0.35-0.45.
  reservation_floor: 0.40
  # --- Jobbflöden: positioner föds och dör. Utan detta är antalet jobb konstant
  #     och Beveridgekurvan en bokföringsidentitet (v linjär i u).
  job_flows: true
  job_destruction_rate: 0.10   # andel av positionerna som upphör per år
  # Andel av arbetsgivarens underskott som postas per månad. Vid partiell
  # anpassning är jämvikten fill*(T - J) = (delta/12)*J, alltså ett STÅENDE
  # underskott av positioner som aldrig finns:
  #
  #     D/T = (delta/12) / (fill + delta/12)
  #     fill 0.25 -> 3.2 %  av 10 400 jobb = 336 positioner
  #     fill 1.00 -> 0.8 %                  =  86 positioner
  #
  # Och u = u_min + V/L exakt, där u_min = (L - J)/L. Underskottet lades
  # alltså rakt på arbetslösheten: 6.5 procent i konfigurationen blev 8.8
  # mätt (0098). Takten var aldrig motiverad -- den är ingen ekonomisk
  # fördröjning utan en godtycklig anpassningshastighet, och den enda
  # fördröjning som hör hemma här är arbetsgivarens beslut att ersätta en
  # förlorad position, som inte är modellerad (arbetsgivaren som agent,
  # fråga 3, pausad). 1.0 betyder att en förstörd position är utlyst inom
  # en månad, och kvar av underskottet är den månadens eftersläpning.
  vacancy_fill_rate: 1.0
  employer_growth_rate: 0.0    # måltalets tillväxt per år (0 = stationärt)

  # Samla ALLA event-tider på samma ställe – alla tider med enhet!
  event_timings:
    recruitment_lag:
      dist: exponential
      mean: 30d     # tid från matchning till tillträde; sätter vakansvaraktigheten
    start_job_search:
      dist: exponential
      mean: 4w      # 4 veckor
    start_education:
      dist: uniform
      min: 5d       # 5 dagar
      max: 40d      # 40 dagar
    career_break:
      dist: uniform
      min: 2w
      max: 12w
    start_internal_training:
      dist: uniform
      min: 14d      # 2 veckor
      max: 60d      # 8 veckor + 4 dagar
    internal_job_change:
      dist: exponential
      mean: 26w     # 6 månader

  # Eventuella effekter av events – ALLTID på events
  event_effects:
    start_education:
      broad:
        delta_chi: 0.8
        delta_r: 0.3
        delta_xi: 10
        duration: 0.7y   # 0.7 år
      specialist:
        delta_chi: 1.5
        delta_r: 0.1
        delta_xi: 3
        duration: 1.2y   # 1.2 år
    internal_training:
      delta_chi: 0.05
      delta_r: 0.2
      delta_xi: 0
      duration: 0.15y    # 0.15 år
    career_break:
      delta_chi: -0.05
      delta_r: -0.02
      delta_xi: 0
      duration: 0.5y     # 0.5 år
    internal_job_change:
      delta_chi: 0.01
      delta_r: 0.1
      delta_xi: 0


