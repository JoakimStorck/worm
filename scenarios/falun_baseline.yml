# === EXAMPLE SCENARIO: Falun Municipality ===
scenario_name: "Falun baseline"
description: >
  Baseline scenario for Falun.
  The purpose is to test matching in a single municipality.
start_year: 2024
n_years: 5          # konvergensanalysen visar att vakanserna behöver 4-5 år för att plana ut
seed: 12345

municipalities:
  - 2080   # Falun

# === Global defaults for all municipalities ===
defaults:
  population: auto          # Will use database if possible
  workforce_ratio: 0.52
  unemployment_rate: 0.07
  education_levels:
    low: 0.25
    medium: 0.60
    high: 0.15
  sex_ratio: 0.51           # Share of women
  occupation_distribution: "realistic"
  employer_distribution:
    n_employers: auto
    employer_ratio_per_population: 0.09
    allocation_order:
      - business_zones
      - commercial_zones
      - small_localities
      - urban_areas
    layer_configs:
      business_zones:
        weight_field: num_workplaces
      commercial_zones:
        weight_field: num_workplaces
      small_localities:
        weight_field: num_workplaces
      urban_areas:
        weight_field: population
    # Storleken dras givet branschen ur yrkesregistret (core/bransch.py).
    # Talet stänger registrets öppna klass 100+.
    workplace_max_size: 1000
  employer:
    training_prob_by_size:
      small: 0.05
      medium: 0.15
      large: 0.40
    # ...andra arbetsgivarparametrar...

  individuals:
    propensities:
      start_education:
        mean: 0.12
        std: 0.05
      internal_training:
        mean: 0.35
        std: 0.12
      quit_job:
        mean: 0.14
        std: 0.07
      career_break:
        mean: 0.06
        std: 0.03
      internal_job_change:
        mean: 0.10
        std: 0.04
    initial_H:
      min: 0.08
      max: 0.25
    # ...här kan du fylla på med fler standardattribut för individer!


# === Municipality-specific overrides (only differences from defaults!) ===
municipality_overrides:
  2080: # Falun
    education_levels:
      low: {curve: linear, start: 0.23, end: 0.18, start_year: 2024, end_year: 2030}
      medium: 0.63
      high: {by_year: {2024: 0.14, 2027: 0.18, 2030: 0.19}}
    workforce_ratio: 0.56
    unemployment_rate: 0.065

# === Policy rules (example, can be expanded) ===
hiring_policy: "random"
wage_policy: "market_adjust"

# === Simulation parameters ===
# Delad simulation-konfiguration, så att jämförelser mellan kommuner mäter
# kommunskillnader och inte parameterskillnader. Enskilda nycklar kan
# överskuggas genom att ange dem under simulation: här nedan.
extends: _simulation_defaults.yml

simulation:
  logfile_path: output/falun_baseline_log.txt
