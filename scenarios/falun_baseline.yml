scenario_name: "Falun auto employers"
year: 2024
seed: 42
municipalities: ["2080"]
population: 58000
workforce_ratio: 0.52

employer_distribution:
  n_employers: auto
  employer_ratio_per_population: 0.09  # 9 per 100 invånare
  allocation_order:
    - business_zones
    - commercial_zones
    - small_localities
    - urban_areas
  layer_configs:
    business_zones:
      weight_field: num_workplaces
    commercial_zones:
      weight_field: num_workplaces
    small_localities:
      weight_field: num_workplaces
    urban_areas:
      weight_field: population
  employer_size_distribution:
    micro:
      max_size: 9
      ratio: 0.85
    small:
      min_size: 10
      max_size: 49
      ratio: 0.12
    medium_large:
      min_size: 50
      max_size: 250
      ratio: 0.025
    very_large:
      min_size: 251
      max_size: 1000
      ratio: 0.005
