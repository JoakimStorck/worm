# === EXEMPELSCENARIO: Falu kommun ===
scenario_name: "Falun baseline"
description: >
  Baslinjescenario för Falun.
  Syftet är att testa matching i en kommun.
start_year: 2024
end_year: 2030
seed: 12345

municipalities:
  - 2080   # Falun

# === Globalt default för alla kommuner ===
defaults:
  population: auto          # Tar från databas om möjligt
  workforce_ratio: 0.52
  unemployment_rate: 0.07
  education_levels:
    low: 0.25
    medium: 0.60
    high: 0.15
  sex_ratio: 0.51           # Andel kvinnor
  occupation_distribution: "realistic"
  employer_distribution:
    n_employers: auto
    employer_ratio_per_population: 0.09
    allocation_order:
      - business_zones
      - commercial_zones
      - small_localities
      - urban_areas
    layer_configs:
      business_zones:
        weight_field: num_workplaces
      commercial_zones:
        weight_field: num_workplaces
      small_localities:
        weight_field: num_workplaces
      urban_areas:
        weight_field: population
    employer_size_distribution:
      micro:
        max_size: 9
        ratio: 0.85
      small:
        min_size: 10
        max_size: 49
        ratio: 0.12
      medium_large:
        min_size: 50
        max_size: 250
        ratio: 0.025
      very_large:
        min_size: 251
        max_size: 1000
        ratio: 0.005

# === Kommunvisa overrides (bara skillnader mot defaults!) ===
municipality_overrides:
  2080: # Falun
    education_levels:
      low: {curve: linear, start: 0.23, end: 0.18, start_year: 2024, end_year: 2030}
      medium: 0.63
      high: {by_year: {2024: 0.14, 2027: 0.18, 2030: 0.19}}
    workforce_ratio: 0.56
    unemployment_rate: 0.065

# === Policyregler (exempel, kan kompletteras) ===
hiring_policy: "random"
wage_policy: "market_adjust"


