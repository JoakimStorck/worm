<!DOCTYPE html>
<!--
  viewer/index.html -- visningsapp för en WORM-körning.

  Läser en JSON-fil skriven av scripts/export_viz.py och spelar upp den månad
  för månad. Kör inte modellen och pratar inte med Python: allt som visas
  ligger i filen.

  INGA EXTERNA BIBLIOTEK, med avsikt. En demo för beslutsfattare körs på en
  lånad projektor i ett rum med trasigt wifi, och ett CDN-anrop som inte går
  fram är en svart skärm. Koordinaterna är redan projicerade (EPSG:3006,
  meter), så en linjär transform räcker -- den kartprojektion ett
  kartbibliotek hade bidragit med är redan gjord.

  Punkterna ritas på canvas och kommunerna på samma canvas under dem: 2 000
  individer gånger 120 bildrutor är 240 000 uppdateringar, och som DOM-noder
  hakar uppspelningen.

      python -m http.server 8000
      http://localhost:8000/viewer/?data=../viz/run_20260914_201623.json
-->
<html lang="sv">
<head>
<meta charset="utf-8">
<title>WORM -- uppspelning</title>
<style>
  :root {
    --bg: #12131a; --panel: #1b1d26; --text: #e8e6e0; --dim: #8b8b96;
    --linje: #2c2f3c;
    --anstalld: #4a9d7f; --arbetslos: #d4703a; --vakans: #e0c060;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Inter", "Helvetica Neue", Arial, sans-serif;
  }
  header { padding: 14px 20px 10px; }
  h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .01em; }
  .harkomst { color: var(--dim); font-size: 12px; margin-top: 2px; }
  main { display: grid; grid-template-columns: 1fr 260px; gap: 16px;
         padding: 0 20px 20px; align-items: start; }
  .karta { position: relative; background: var(--panel); border-radius: 6px;
           overflow: hidden; }
  canvas { display: block; width: 100%; }
  .tid { position: absolute; left: 16px; top: 14px; font-size: 26px;
         font-weight: 600; font-variant-numeric: tabular-nums; }
  .sido { display: flex; flex-direction: column; gap: 14px; }
  .kort { background: var(--panel); border-radius: 6px; padding: 12px 14px; }
  .kort h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600;
             letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .tal { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  .tal + .tal { margin-top: 4px; }
  .tal b { font-weight: 600; }
  .lagerrad { display: flex; align-items: center; justify-content: space-between;
              gap: 8px; padding: 2px 0; }
  .antal { color: var(--dim); font-variant-numeric: tabular-nums; }
  .lagerrad label { display: flex; align-items: center; gap: 7px; cursor: pointer;
                    font-size: 12px; }
  .lagerrad input { accent-color: var(--anstalld); margin: 0; }
  .flytt { display: flex; gap: 2px; flex: none; }
  .flytt button { padding: 0 5px; font-size: 10px; line-height: 18px; }
  .flytt button:disabled { opacity: .25; cursor: default; }
  .legend { display: flex; align-items: center; gap: 7px; margin-top: 5px;
            font-size: 12px; color: var(--dim); }
  .prick { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .kontroller { display: flex; align-items: center; gap: 12px;
                padding: 10px 20px 0; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--linje);
           border-radius: 4px; padding: 6px 14px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  input[type=range] { flex: 1; accent-color: var(--anstalld); }
  .pendling td { padding: 1px 0; font-variant-numeric: tabular-nums; }
  .pendling td.n { text-align: right; padding-left: 10px; }
  .pendling td.scb { text-align: right; padding-left: 10px; color: var(--dim); }
  .fel { padding: 40px 20px; color: var(--arbetslos); }
</style>
</head>
<body>
<header>
  <h1>WORM &mdash; <span id="scenario">uppspelning</span></h1>
  <div class="harkomst" id="harkomst"></div>
</header>

<div class="kontroller">
  <button id="spela">Spela</button>
  <input type="range" id="skjut" min="0" max="0" value="0">
  <span id="ruta" class="harkomst"></span>
</div>

<main>
  <div class="karta">
    <canvas id="duk"></canvas>
    <div class="tid" id="tid"></div>
  </div>
  <div class="sido">
    <div class="kort">
      <h2>Arbetsmarknaden</h2>
      <div class="tal"><span>Sysselsatta</span><b id="a-syss">&ndash;</b></div>
      <div class="tal"><span>Arbetslösa</span><b id="a-arbl">&ndash;</b></div>
      <div class="tal"><span>Arbetslöshet</span><b id="a-u">&ndash;</b></div>
      <div class="tal"><span>Vakanser</span><b id="a-vak">&ndash;</b></div>
      <div class="tal"><span>Vakansgrad</span><b id="a-v">&ndash;</b></div>
    </div>
    <div class="kort">
      <h2>Lager</h2>
      <div id="lager"></div>
      <div class="harkomst" style="margin-top:8px">Överst i listan ritas överst i bilden.</div>
      <div class="harkomst" id="panelnot" style="margin-top:6px"></div>
    </div>
    <div class="kort">
      <h2>Pendling över kommungräns</h2>
      <table class="pendling" id="pendling"></table>
      <div class="harkomst" style="margin-top:8px">Modell mot SCB (grått).</div>
    </div>
  </div>
</main>

<script>
"use strict";

const FARG = { anstalld: "#4a9d7f", arbetslos: "#d4703a", vakans: "#e0c060" };
const el = (id) => document.getElementById(id);

async function start() {
  const url = new URLSearchParams(location.search).get("data");
  if (!url) {
    document.body.innerHTML =
      '<div class="fel">Ange körning: <code>?data=../viz/&lt;run&gt;.json</code></div>';
    return;
  }
  let d;
  try {
    const svar = await fetch(url);
    if (!svar.ok) throw new Error(svar.status + " " + svar.statusText);
    d = await svar.json();
  } catch (e) {
    document.body.innerHTML =
      '<div class="fel">Kunde inte läsa ' + url + ': ' + e.message +
      '<br>Kör <code>python -m http.server 8000</code> från repo-roten.</div>';
    return;
  }
  rita(d);
}

function rita(d) {
  const duk = el("duk"), ctx = duk.getContext("2d");
  const frames = d.frames;

  el("scenario").textContent = d.meta.scenario || d.meta.run;
  el("harkomst").textContent =
    [d.meta.run, d.meta.commit ? "commit " + d.meta.commit : null,
     d.meta.seed != null ? "frö " + d.meta.seed : null,
     d.meta.n_months + " månader"].filter(Boolean).join("  \u00b7  ");
  el("panelnot").textContent =
    d.meta.panel.workers.toLocaleString("sv") + " av " +
    d.meta.panel.population.toLocaleString("sv") +
    " individer visas. Talen ovan gäller hela populationen.";

  // --- Utsnitt. Kommunernas ytterkontur styr om den finns, annars punkterna.
  let xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
  const omslut = (x, y) => {
    if (x < xmin) xmin = x; if (x > xmax) xmax = x;
    if (y < ymin) ymin = y; if (y > ymax) ymax = y;
  };
  const ringarUr = (lista, rakna) => {
    const ut = [];
    for (const omr of lista || []) {
      const g = omr.geometry;
      const delar = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
      for (const poly of delar) for (const ring of poly) {
        ut.push(ring);
        if (rakna) for (const [x, y] of ring) omslut(x, y);
      }
    }
    return ut;
  };
  // Utsnittet styrs av kommunerna. DeSO ligger per definition innanför dem,
  // och ett DeSO som sträcker sig utanför vore ett datafel snarare än en
  // anledning att zooma ut.
  const ringar = ringarUr(d.municipalities, true);
  const desoringar = ringarUr(d.deso, false);
  if (!ringar.length) {
    for (let i = 0; i < d.workers.x.length; i++) omslut(d.workers.x[i], d.workers.y[i]);
  }

  let skala = 1, dx = 0, dy = 0, H = 0;
  function matt() {
    const B = duk.clientWidth;
    H = Math.round(B * (ymax - ymin) / (xmax - xmin));
    H = Math.max(360, Math.min(H, 720));
    const dpr = window.devicePixelRatio || 1;
    duk.width = B * dpr; duk.height = H * dpr;
    duk.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const marg = 18;
    skala = Math.min((B - 2 * marg) / (xmax - xmin), (H - 2 * marg) / (ymax - ymin));
    dx = (B - (xmax - xmin) * skala) / 2;
    dy = (H - (ymax - ymin) * skala) / 2;
  }
  // y vänds: kartkoordinater växer norrut, canvas nedåt.
  const px = (x) => dx + (x - xmin) * skala;
  const py = (y) => H - dy - (y - ymin) * skala;

  // --- LAGREN. Ordningen i listan ÄR ritordningen, och det sista lagret
  // dominerar bilden: 2 000 punkter på en kommunkarta täcker varandra, och
  // vilken slutsats en betraktare drar beror på vad som ligger överst.
  // Arbetslösa ovanpå anställda visar var arbetslösheten sitter; tvärtom
  // visar var jobben finns. Båda är sanna, och det ska vara ett val man gör
  // och ser att man gjort -- inte en ordning som råkade hamna i koden.
  const bana = (ring) => {
    ctx.beginPath();
    ctx.moveTo(px(ring[0][0]), py(ring[0][1]));
    for (let k = 1; k < ring.length; k++) ctx.lineTo(px(ring[k][0]), py(ring[k][1]));
    ctx.closePath();
  };

  const LAGER = [
    { id: "deso", namn: "DeSO-områden", pa: false,
      antal: () => desoringar.length, rita: () => {
        // Bakgrundsindelning: den upplösning modellens geografi har. Tunn och
        // dämpad, utan fyllning, så att den aldrig konkurrerar med
        // kommungränsen.
        ctx.strokeStyle = "#2a2d3a"; ctx.lineWidth = 0.6;
        for (const ring of desoringar) bana(ring), ctx.stroke();
      } },
    { id: "kommuner", namn: "Kommuner", pa: true,
      antal: () => (d.municipalities || []).length, rita: () => {
        // KRAFTIGARE ÄN DeSO, med avsikt. Kommungränsen är den enda gräns i
        // bilden som bär en fråga: pendlingen som korsar den är vad
        // scenariot finns för. DeSO är indelning, kommun är gräns, och
        // linjebredden ska säga vilket som är vilket utan bildtext.
        ctx.fillStyle = "rgba(255,255,255,0.025)";
        ctx.strokeStyle = "#5b6178"; ctx.lineWidth = 1.8;
        for (const ring of ringar) bana(ring), ctx.fill(), ctx.stroke();
      } },
    { id: "besatta", namn: "Besatta positioner", pa: false,
      antal: (f) => f.jobs.state.filter((v) => v === 0).length, rita: (f) => {
        ctx.fillStyle = "#3b5c50";
        const js = f.jobs.state;
        for (let k = 0; k < js.length; k++) {
          if (js[k] !== 0) continue;
          ctx.fillRect(px(d.jobs.x[k]) - 1.5, py(d.jobs.y[k]) - 1.5, 3, 3);
        }
      } },
    { id: "vakanser", namn: "Lediga positioner", pa: true,
      antal: (f) => f.jobs.state.filter((v) => v === 1).length, rita: (f) => {
        ctx.fillStyle = FARG.vakans;
        const js = f.jobs.state;
        for (let k = 0; k < js.length; k++) {
          if (js[k] !== 1) continue;
          ctx.fillRect(px(d.jobs.x[k]) - 1.5, py(d.jobs.y[k]) - 1.5, 3, 3);
        }
      } },
    { id: "anstallda", namn: "Anställda", pa: true,
      antal: (f) => f.workers.state.filter((v) => v).length, rita: (f) => {
        ctx.fillStyle = FARG.anstalld;
        const ws = f.workers.state;
        for (let k = 0; k < ws.length; k++) {
          if (!ws[k]) continue;
          ctx.beginPath();
          ctx.arc(px(d.workers.x[k]), py(d.workers.y[k]), 1.6, 0, 6.2832);
          ctx.fill();
        }
      } },
    { id: "arbetslosa", namn: "Arbetslösa", pa: true,
      antal: (f) => f.workers.state.filter((v) => !v).length, rita: (f) => {
        ctx.fillStyle = FARG.arbetslos;
        const ws = f.workers.state;
        for (let k = 0; k < ws.length; k++) {
          if (ws[k]) continue;
          ctx.beginPath();
          ctx.arc(px(d.workers.x[k]), py(d.workers.y[k]), 2.4, 0, 6.2832);
          ctx.fill();
        }
      } },
    { id: "linjer", namn: "Bostad \u2192 arbetsställe", pa: false,
      antal: (f) => antalLinjer(f), rita: (f) => {
        // En linje per anställd i panelen, från bostad till arbetsställe.
        // Linjer över kommungräns ritas ljusare och tjockare: det är dem
        // scenariot handlar om, och i ett mönster av tusen streck försvinner
        // de annars bland de korta lokala.
        const ws = f.workers.state, jb = f.workers.job;
        for (const over of [false, true]) {
          ctx.strokeStyle = over ? "rgba(224,192,96,0.55)" : "rgba(140,150,180,0.18)";
          ctx.lineWidth = over ? 0.9 : 0.5;
          ctx.beginPath();
          for (let k = 0; k < ws.length; k++) {
            const j = jb[k];
            if (!ws[k] || j < 0) continue;
            if ((d.workers.mun[k] !== d.jobs.mun[j]) !== over) continue;
            ctx.moveTo(px(d.workers.x[k]), py(d.workers.y[k]));
            ctx.lineTo(px(d.jobs.x[j]), py(d.jobs.y[j]));
          }
          ctx.stroke();
        }
      } },
  ];

  // Anställda utan känt arbetsställe kan inte få en linje. Med nuvarande
  // export ska de vara noll -- varje jobb en panelmedlem tagit ligger i
  // panelen -- men talet i lagerlistan ska visa vad som faktiskt ritas, inte
  // vad som borde ritas.
  function antalLinjer(f) {
    const ws = f.workers.state, jb = f.workers.job;
    let n = 0;
    for (let k = 0; k < ws.length; k++) if (ws[k] && jb[k] >= 0) n++;
    return n;
  }

  function lagerpanel() {
    const ul = el("lager");
    ul.innerHTML = "";
    // Listan visas överst först, alltså omvänd ritordning: det man ser
    // längst upp i listan är det man ser överst i bilden.
    LAGER.slice().reverse().forEach((lg) => {
      const n = LAGER.indexOf(lg);
      const rad = document.createElement("div");
      rad.className = "lagerrad";
      rad.innerHTML =
        '<label><input type="checkbox"' + (lg.pa ? " checked" : "") + '>' +
        '<span class="prick" style="background:' + lagerfarg(lg.id) + '"></span>' +
        lg.namn + ' <span class="antal" data-lager="' + lg.id + '"></span></label>' +
        '<span class="flytt"><button title="Flytta upp">\u25b2</button>' +
        '<button title="Flytta ned">\u25bc</button></span>';
      rad.querySelector("input").addEventListener("change", (e) => {
        lg.pa = e.target.checked; rutan(i);
      });
      const [upp, ned] = rad.querySelectorAll(".flytt button");
      upp.disabled = n === LAGER.length - 1;
      ned.disabled = n === 0;
      upp.addEventListener("click", () => byt(n, n + 1));
      ned.addEventListener("click", () => byt(n, n - 1));
      ul.appendChild(rad);
    });
  }
  // Antalen uppdateras separat från panelen: att bygga om listan varje månad
  // skulle nolla fokus och göra kryssrutorna oklickbara under uppspelning.
  function lagerantal(f) {
    for (const lg of LAGER) {
      const ruta = document.querySelector('.antal[data-lager="' + lg.id + '"]');
      if (!ruta) continue;
      const n = lg.antal ? lg.antal(f) : null;
      ruta.textContent = n == null ? "" : "(" + n.toLocaleString("sv") + ")";
    }
  }

  function byt(a, b) {
    if (b < 0 || b >= LAGER.length) return;
    [LAGER[a], LAGER[b]] = [LAGER[b], LAGER[a]];
    lagerpanel(); rutan(i);
  }
  const lagerfarg = (id) => ({
    kommuner: "#343846", besatta: "#3b5c50", vakanser: FARG.vakans,
    anstallda: FARG.anstalld, arbetslosa: FARG.arbetslos,
  })[id] || "#555";

  function rutan(i) {
    const f = frames[i];
    ctx.clearRect(0, 0, duk.clientWidth, H);

    for (const lager of LAGER) if (lager.pa) lager.rita(f);
    lagerantal(f);

    const a = f.agg;
    el("tid").textContent = (f.year || "") + (f.month ? "-" + String(f.month).padStart(2, "0") : "");
    const tal = (v, d2) => v == null ? "\u2013" : v.toLocaleString("sv",
      { minimumFractionDigits: d2 || 0, maximumFractionDigits: d2 || 0 });
    el("a-syss").textContent = tal(a.employed);
    el("a-arbl").textContent = tal(a.unemployed);
    el("a-u").textContent = a.u == null ? "\u2013" : tal(a.u, 1) + " %";
    el("a-vak").textContent = tal(a.vacancies);
    el("a-v").textContent = a.v == null ? "\u2013" : tal(a.v, 1) + " %";
    el("ruta").textContent = "ruta " + (i + 1) + " av " + frames.length;

    // Pendling: bara över kommungräns, det är den modellen ska pröva.
    const rader = Object.entries(f.commuting || {})
      .filter(([k]) => { const p = k.split(">"); return p[0] !== p[1]; })
      .sort((p, q) => q[1] - p[1]).slice(0, 6);
    el("pendling").innerHTML = rader.map(([k, n]) => {
      const scb = (d.commuting_scb || {})[k];
      return "<tr><td>" + namn(k) + "</td><td class='n'>" +
        n.toLocaleString("sv") + "</td><td class='scb'>" +
        (scb == null ? "\u2013" : scb.toLocaleString("sv")) + "</td></tr>";
    }).join("");
  }

  const namnkarta = {};
  for (const k of d.municipalities || []) namnkarta[k.code] = k.name;
  const namn = (nyckel) => nyckel.split(">").map((c) => namnkarta[c] || c).join(" \u2192 ");

  // --- Uppspelning
  const skjut = el("skjut"), knapp = el("spela");
  skjut.max = frames.length - 1;
  let i = 0, timer = null;
  const visa = (n) => { i = n; skjut.value = n; rutan(n); };

  skjut.addEventListener("input", () => { stopp(); visa(+skjut.value); });
  knapp.addEventListener("click", () => timer ? stopp() : spela());
  window.addEventListener("resize", () => { matt(); rutan(i); });
  document.addEventListener("keydown", (e) => {
    if (e.key === " ") { e.preventDefault(); timer ? stopp() : spela(); }
    if (e.key === "ArrowRight") visa(Math.min(i + 1, frames.length - 1));
    if (e.key === "ArrowLeft") visa(Math.max(i - 1, 0));
  });

  function spela() {
    if (i >= frames.length - 1) visa(0);
    knapp.textContent = "Pausa";
    timer = setInterval(() => {
      if (i >= frames.length - 1) return stopp();
      visa(i + 1);
    }, 110);
  }
  function stopp() {
    clearInterval(timer); timer = null; knapp.textContent = "Spela";
  }

  lagerpanel();
  matt(); visa(0);
}

start();
</script>
</body>
</html>
